<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="FLARENEXUS">
  <title>FlareNexus</title>
  <defs>
    <linearGradient id="fx-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060817" />
      <stop offset="1" stop-color="#0A0B18" />
    </linearGradient>
    <linearGradient id="fx-flame" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0" stop-color="#F97316" />
      <stop offset="0.55" stop-color="#FB923C" />
      <stop offset="1" stop-color="#FFD166" />
    </linearGradient>
    <linearGradient id="fx-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE" />
      <stop offset="1" stop-color="#7C5CFF" />
    </linearGradient>
    <radialGradient id="fx-halo" cx="0.5" cy="0.58" r="0.5">
      <stop offset="0" stop-color="#FB923C" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#FB923C" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="13" fill="url(#fx-bg)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="12.25" fill="none" stroke="url(#fx-ring)" stroke-opacity="0.5" stroke-width="1.5" />

  <!-- Orbital ring: the mission layer, tilted so it reads as a track rather than a border. -->
  <ellipse cx="32" cy="33" rx="22" ry="8.5" fill="none" stroke="url(#fx-ring)" stroke-width="1.6" stroke-opacity="0.9" transform="rotate(-20 32 33)" />

  <!-- Combustion plume inside the ring: the product premise in one mark. -->
  <circle cx="32" cy="33" r="17" fill="url(#fx-halo)" />
  <path d="M32 17c4.6 7 3 11.4-.5 15.1-3 3.2-5.8 6.1-5.8 9.8 0 4.4 3.2 7.7 6.3 7.7s6.3-3.3 6.3-7.7c0-2-.9-4.1-2-5.7 3 1.6 5.4 5 5.4 8.9C41.7 50.7 37.4 55 32 55s-9.7-4.3-9.7-11.9c0-7 5.2-11 8.3-15 1.9-2.7 2.8-5.4 1.4-8.5z" fill="url(#fx-flame)" />
  <circle cx="32" cy="42.2" r="3" fill="#0A0B18" opacity="0.6" />
</svg>
